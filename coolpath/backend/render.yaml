services:
  - type: web
    name: coolpath-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip setuptools wheel && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FORTYGUARD_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
