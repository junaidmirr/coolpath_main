# LEGACY/FALLBACK DEPLOYMENT CONFIGURATION
# Primary deployment is now Google Cloud Run via GitHub Actions
services:
  - type: web
    name: coolpath-backend
    env: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile
    preDeployCommand: alembic upgrade head
    region: oregon
    plan: free
    envVars:
      - key: DEMO_MODE
        value: "false"
      - key: FORTYGUARD_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEOAPIFY_API_KEY
        sync: false
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_TRACING
        value: "true"
      - key: LANGSMITH_PROJECT
        value: "coolpath"
      - key: SUPABASE_DB_URL
        sync: false
      - key: APP_DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: CHECKPOINT_DATABASE_URL
        sync: false
      - key: DATABASE_POOL_MODE
        value: transaction
