services:
  - type: web
    name: coolpath-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip setuptools wheel && pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEMO_MODE
        value: "false"
      - key: FORTYGUARD_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEOAPIFY_API_KEY
        sync: false
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_TRACING
        value: "true"
      - key: LANGSMITH_PROJECT
        value: "coolpath"
      - key: SUPABASE_DB_URL
        sync: false
      - key: APP_DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: CHECKPOINT_DATABASE_URL
        sync: false
      - key: DATABASE_POOL_MODE
        value: transaction
