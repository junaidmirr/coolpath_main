name: CoolPath CD

on:
  workflow_run:
    workflows: ["CoolPath CI"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  deploy-render:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}/coolpath-backend
        tags: |
          type=sha
          type=raw,value=latest

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Trigger Render Deployment
      if: success()
      run: |
        curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        
    - name: Verify Deployed Health and Readiness
      if: success()
      run: |
        echo "Waiting for deployment to propagate..."
        sleep 60
        # The URL must be provided as a repository variable
        SERVICE_URL="${{ vars.RENDER_SERVICE_URL }}"
        
        # Verify /health
        curl --fail "$SERVICE_URL/health"
        
        # Verify /ready
        curl --fail "$SERVICE_URL/ready"
