name: CoolPath CI

on:
  push:
    branches: [ "main", "feature/thermal-dispatch-gate" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx
        
    - name: Test with pytest
      working-directory: ./backend
      env:
        GEMINI_API_KEY: "dummy"
        FORTYGUARD_API_KEY: "dummy"
        GEOAPIFY_API_KEY: "dummy"
        APP_DATABASE_URL: "sqlite:///./dummy.db"
        MIGRATION_DATABASE_URL: "sqlite:///./dummy.db"
        CHECKPOINT_DATABASE_URL: "sqlite:///./dummy.db"
      run: |
        pytest

  frontend-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci || npm install
      
    - name: Build
      working-directory: ./frontend
      run: npm run build
