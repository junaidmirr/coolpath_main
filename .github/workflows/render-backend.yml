name: CoolPath Backend Render Deploy

on:
  push:
    branches:
      - main
      - feature/thermal-dispatch-gate
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/coolpath-backend
  IMAGE_REF: ghcr.io/${{ github.repository_owner }}/coolpath-backend:${{ github.sha }}
  RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: coolpath/backend/requirements.txt

      - name: Install backend dependencies
        working-directory: coolpath/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run backend tests
        working-directory: coolpath/backend
        env:
          GEMINI_API_KEY: dummy
          FORTYGUARD_API_KEY: dummy
          GEOAPIFY_API_KEY: dummy
          DATABASE_POOL_MODE: transaction
          PYTHONPATH: .
        run: python -m pytest tests -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: coolpath/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: coolpath/frontend
        run: npm ci

      - name: Build frontend
        working-directory: coolpath/frontend
        env:
          VITE_API_BASE_URL: ${{ vars.RENDER_SERVICE_URL }}
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for certification
        uses: docker/build-push-action@v6
        with:
          context: coolpath/backend
          load: true
          tags: ${{ env.IMAGE_REF }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Certify container health
        run: |
          docker run -d --name coolpath-backend-cert -p 8080:8080 \
            -e DEMO_MODE=false \
            -e GEMINI_API_KEY=dummy \
            -e FORTYGUARD_API_KEY=dummy \
            -e GEOAPIFY_API_KEY=dummy \
            "${IMAGE_REF}"
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8080/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs coolpath-backend-cert
          exit 1

      - name: Stop certification container
        if: always()
        run: docker rm -f coolpath-backend-cert || true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push immutable GHCR image
        run: docker push "${IMAGE_REF}"

      - name: Run Alembic migrations
        working-directory: coolpath/backend
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          PYTHONPATH: .
        run: |
          if [ -z "$MIGRATION_DATABASE_URL" ]; then
            echo "MIGRATION_DATABASE_URL secret is required."
            exit 1
          fi
          alembic upgrade head

      - name: Trigger Render exact image deploy
        if: ${{ env.RENDER_DEPLOY_HOOK_URL != '' }}
        run: |
          curl --fail --show-error --silent --get \
            --data-urlencode "imgURL=${IMAGE_REF}" \
            "$RENDER_DEPLOY_HOOK_URL"

      - name: Note pending Render bootstrap
        if: ${{ env.RENDER_DEPLOY_HOOK_URL == '' }}
        run: echo "GHCR image published; Render deploy waits for RENDER_DEPLOY_HOOK_URL."

      - name: Verify deployed health and readiness
        if: ${{ vars.RENDER_SERVICE_URL != '' }}
        run: |
          for i in {1..60}; do
            if curl --fail --silent "${{ vars.RENDER_SERVICE_URL }}/health" > /dev/null \
              && curl --fail --silent "${{ vars.RENDER_SERVICE_URL }}/ready" > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          curl --fail "${{ vars.RENDER_SERVICE_URL }}/health"
          curl --fail "${{ vars.RENDER_SERVICE_URL }}/ready"

      - name: Verify production CORS
        if: ${{ vars.RENDER_SERVICE_URL != '' && vars.VERCEL_FRONTEND_URL != '' }}
        run: |
          curl --fail --silent --show-error -X OPTIONS \
            -H "Origin: ${{ vars.VERCEL_FRONTEND_URL }}" \
            -H "Access-Control-Request-Method: POST" \
            "${{ vars.RENDER_SERVICE_URL }}/api/mission" \
            -D /tmp/cors_headers.txt -o /dev/null
          grep -i "access-control-allow-origin: ${{ vars.VERCEL_FRONTEND_URL }}" /tmp/cors_headers.txt
