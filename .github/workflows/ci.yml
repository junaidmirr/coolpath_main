name: CoolPath CI

on:
  push:
    branches: [main, codex/web-production]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coolpath/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: coolpath/backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Run backend tests
        env:
          GEMINI_API_KEY: dummy
          FORTYGUARD_API_KEY: dummy
          GEOAPIFY_API_KEY: dummy
          APP_DATABASE_URL: sqlite:///./dummy.db
          MIGRATION_DATABASE_URL: sqlite:///./dummy.db
          CHECKPOINT_DATABASE_URL: sqlite:///./dummy.db
        run: pytest

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coolpath/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: coolpath/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build web app
        run: npm run build

  docker-test:
    needs: backend-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t coolpath-backend:test ./coolpath/backend
      - name: Verify container readiness
        run: |
          docker run -d --name test-backend -p 8080:8080 coolpath-backend:test
          for attempt in {1..12}; do curl --fail http://localhost:8080/health && break || sleep 5; done
          curl --fail http://localhost:8080/health
          docker logs test-backend
          docker rm -f test-backend
