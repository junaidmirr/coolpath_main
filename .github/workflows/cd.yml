name: CoolPath CD

on:
  workflow_run:
    workflows: [CoolPath CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  deploy-render:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/coolpath-backend
          tags: |
            type=sha
            type=raw,value=latest
      - name: Build and publish backend image
        uses: docker/build-push-action@v5
        with:
          context: ./coolpath/backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Trigger Render deployment
        run: curl --fail --retry 5 --retry-delay 10 -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
      - name: Verify deployed health and readiness
        run: |
          sleep 60
          curl --fail "${{ vars.RENDER_SERVICE_URL }}/health"
